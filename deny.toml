[advisories]

# Deny yanked crates to catch supply chain issues early.
yanked = "deny"
# Emulate cargo-audit which only checks vulnerabilities and yanked crates, not unmaintained/unsound.
unmaintained = "none"
unsound = "none"

ignore = [
    # rsa: Marvin Attack timing sidechannel. No safe upgrade is available, and
    # the reachable path is through jsonwebtoken.
    "RUSTSEC-2023-0071",
]

[licenses]
# Explicit allow-list: every dependency's license must be on it.
# Policy: permissive licenses plus weak copyleft (MPL-2.0, LGPL-3.0) are
# acceptable for internal DoD distribution. Strong copyleft (GPL, AGPL) is
# denied — it would encumber the binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "bzip2-1.0.6",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "LGPL-3.0-or-later",
]
# Confidence threshold for license text detection (0.0-1.0).
confidence-threshold = 0.8

[licenses.private]
# Workspace members (including the vendored v8 build wrapper, which carries
# no license field in its Cargo.toml) are first-party code, not supply chain.
ignore = true
